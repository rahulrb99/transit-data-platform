name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run Ruff
        run: ruff check .

  database-and-dbt:
    name: Tests, PostgreSQL, and dbt
    runs-on: ubuntu-latest
    needs: lint
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: transit_ci
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: transit_ci
          POSTGRES_USER: transit
          POSTGRES_PASSWORD: transit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transit -d transit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Initialize deterministic CI database
        run: python scripts/initialize_ci_database.py
      - name: Run Python unit and PostgreSQL integration tests
        run: pytest
      - name: Parse dbt project
        run: dbt parse --project-dir dbt --profiles-dir dbt
      - name: Build and test dbt project
        run: dbt build --project-dir dbt --profiles-dir dbt

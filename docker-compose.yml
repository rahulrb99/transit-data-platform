x-app: &app
  image: ${APP_IMAGE:-transit-app:local}
  build:
    context: .
    dockerfile: dashboard/Dockerfile
  init: true
  restart: unless-stopped
  environment: &app-environment
    APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-transit}
    POSTGRES_USER: ${POSTGRES_USER:-transit}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    VEHICLE_POSITIONS_TOPIC: ${VEHICLE_POSITIONS_TOPIC:-vehicle_positions}
    VEHICLE_POSITIONS_CONSUMER_GROUP: ${VEHICLE_POSITIONS_CONSUMER_GROUP:-vehicle-position-postgres-writer}
    RAW_DATA_ROOT: /app/data/raw
    RAW_ARCHIVE_ROOT: /app/data/archive/raw
    PROCESSED_DATA_ROOT: /app/data/processed
    MBTA_GTFS_STATIC_URL: ${MBTA_GTFS_STATIC_URL:-https://cdn.mbta.com/MBTA_GTFS.zip}
    MBTA_VEHICLE_POSITIONS_URL: ${MBTA_VEHICLE_POSITIONS_URL:-https://cdn.mbta.com/realtime/VehiclePositions.pb}
    MBTA_POLL_INTERVAL_SECONDS: ${MBTA_POLL_INTERVAL_SECONDS:-15}
    MBTA_HTTP_TIMEOUT_SECONDS: ${MBTA_HTTP_TIMEOUT_SECONDS:-30}
    MBTA_CONSUMER_BATCH_SIZE: ${MBTA_CONSUMER_BATCH_SIZE:-100}
    MBTA_REALTIME_STALE_THRESHOLD_SECONDS: ${MBTA_REALTIME_STALE_THRESHOLD_SECONDS:-60}
    RUNTIME_HEALTH_MAX_AGE_SECONDS: ${RUNTIME_HEALTH_MAX_AGE_SECONDS:-300}
    DASHBOARD_REFRESH_INTERVAL_SECONDS: ${DASHBOARD_REFRESH_INTERVAL_SECONDS:-30}
    DASHBOARD_VEHICLE_MAX_AGE_SECONDS: ${DASHBOARD_VEHICLE_MAX_AGE_SECONDS:-90}
    REALTIME_RETENTION_DAYS: ${REALTIME_RETENTION_DAYS:-14}
    METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-30}
    RAW_PAYLOAD_RETENTION_DAYS: ${RAW_PAYLOAD_RETENTION_DAYS:-7}
    RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-1000}
    RETENTION_MAX_BATCHES: ${RETENTION_MAX_BATCHES:-100}
    ARCHIVE_MIN_FREE_BYTES: ${ARCHIVE_MIN_FREE_BYTES:-2147483648}
    ARCHIVE_BACKEND: ${ARCHIVE_BACKEND:-local}
    ARCHIVE_STATUS_PATH: /app/data/archive/raw/.status/s3-archive.json
    BACKUP_STATUS_PATH: ${BACKUP_STATUS_PATH:-backups/.s3-upload-status.json}
    S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
    AWS_REGION: ${AWS_REGION:-}
    S3_RAW_ARCHIVE_PREFIX: ${S3_RAW_ARCHIVE_PREFIX:-raw-archives}
    S3_POSTGRES_BACKUP_PREFIX: ${S3_POSTGRES_BACKUP_PREFIX:-postgres-backups}
    S3_BACKUP_MAX_AGE_HOURS: ${S3_BACKUP_MAX_AGE_HOURS:-26}
  logging: &bounded-logs
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  migrate:
    <<: *app
    restart: "no"
    command: ["python", "-m", "scripts.migrate_database"]
    depends_on:
      postgres:
        condition: service_healthy

  retention:
    <<: *app
    profiles: ["maintenance"]
    restart: "no"
    command: ["python", "-m", "ingestion.retention"]
    volumes:
      - raw_data:/app/data/raw
      - raw_archive:/app/data/archive/raw
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    container_name: transit-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transit}
      POSTGRES_USER: ${POSTGRES_USER:-transit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Host-side dbt/tests still use this loopback-only development connection.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *bounded-logs
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redpanda:
    image: redpandadata/redpanda:v24.3.4@sha256:0590e03f7122aa88caf57506fd45b148bcd3fc09b74f5789eb81f926affa28ef
    container_name: transit-redpanda
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *bounded-logs
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      # Retained only for optional host-side smoke tests/health inspection.
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redpanda-init:
    image: redpandadata/redpanda:v24.3.4@sha256:0590e03f7122aa88caf57506fd45b148bcd3fc09b74f5789eb81f926affa28ef
    container_name: transit-redpanda-init
    restart: "on-failure:3"
    logging: *bounded-logs
    environment:
      VEHICLE_POSITIONS_TOPIC: ${VEHICLE_POSITIONS_TOPIC:-vehicle_positions}
      REDPANDA_TOPIC_RETENTION_MS: ${REDPANDA_TOPIC_RETENTION_MS:-604800000}
      REDPANDA_TOPIC_RETENTION_BYTES: ${REDPANDA_TOPIC_RETENTION_BYTES:-1073741824}
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - >-
        set -eu;
        rpk topic describe "$${VEHICLE_POSITIONS_TOPIC}" -X brokers=redpanda:9092 >/dev/null 2>&1
        || rpk topic create "$${VEHICLE_POSITIONS_TOPIC}" -X brokers=redpanda:9092 -p 3 -r 1;
        rpk topic alter-config "$${VEHICLE_POSITIONS_TOPIC}" -X brokers=redpanda:9092
        --set retention.ms="$${REDPANDA_TOPIC_RETENTION_MS}"
        --set retention.bytes="$${REDPANDA_TOPIC_RETENTION_BYTES}"

  producer:
    <<: *app
    container_name: transit-producer
    command: ["python", "-m", "ingestion.realtime.producer"]
    # Existing Kafka delivery timeout can take five minutes during an outage.
    stop_grace_period: 6m
    volumes:
      - raw_data:/app/data/raw
      - raw_archive:/app/data/archive/raw
    depends_on: &stream-dependencies
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "ingestion.realtime.runtime_health", "producer"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

  consumer:
    <<: *app
    container_name: transit-consumer
    command: ["python", "-m", "ingestion.realtime.consumer"]
    stop_grace_period: 90s
    depends_on: *stream-dependencies
    healthcheck:
      test: ["CMD", "python", "-m", "ingestion.realtime.runtime_health", "consumer"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

  redpanda-console:
    image: redpandadata/console:v2.8.3@sha256:fc8006f22072293e9fa6a3aa8a0581ac502bc8262767c32c01ee019eca56bb38
    container_name: transit-redpanda-console
    profiles: ["tools"]
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  dashboard:
    <<: *app
    container_name: transit-dashboard
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redpanda_data:
  raw_data:
  raw_archive:
